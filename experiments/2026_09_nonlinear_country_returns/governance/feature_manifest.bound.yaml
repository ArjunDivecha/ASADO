schema_version: '1.0'
status: BOUND_WITH_BLOCKERS
source_selectors_verified: true
audit_snapshot: Data/work/experiments/nonlinear_country_returns/snapshot_2026_09_13
audit_note: >-
  All bindings verified against the frozen 2026-09-13 snapshot (schemas, per-market
  first/last dates, row counts). No selector was guessed; no feature substituted.
  P11's specified 3M tenor does not exist anywhere in the pipeline (collector pulls
  25R1M only) and is marked MISSING. P07/P08 bank-claim edges cover only 21 focal
  markets and are marked INSUFFICIENT_COVERAGE. See governance/data_readiness.md —
  the strict 24-primitive complete-case panel tops out at 15 markets (< 20 floor),
  so the study as specified is BLOCKED_DATA pending an owner-approved amendment.
source_database_defaults:
  warehouse: Data/asado.duckdb (main checkout only — worktree has no Data/)
  loop: Data/loop/asado_loop.duckdb
feature_count: 24
features:
- id: P01
  alias: own_return_5
  definition: own trailing 5 local-session USD total return
  binding_status: BOUND
  database: main
  table_or_view: asado.t2_levels_daily
  selector: variable = 'Tot Return Index'
  value_column: value
  market_or_entity_key: country (T2 names)
  units_and_quote: USD total-return index level; returns = session-close ratio - 1
  historical_availability_rule: latest local close strictly before 23:59 UTC origin
  vintage_policy: none (exchange marks are not revised; corporate-action restatements not expected)
  readiness: VERIFIED_HISTORICAL_AVAILABILITY
  coverage: 34/34 markets, 2000-01-01..2026-09-11, ~9751 obs each
- id: P02
  alias: own_return_21
  definition: own trailing 21 local-session USD total return
  binding_status: BOUND
  same_binding_as: P01
  readiness: VERIFIED_HISTORICAL_AVAILABILITY
- id: P03
  alias: own_return_63
  definition: own trailing 63 local-session USD total return
  binding_status: BOUND
  same_binding_as: P01
  readiness: VERIFIED_HISTORICAL_AVAILABILITY
- id: P04
  alias: own_realized_vol_21
  definition: std dev of previous 21 valid one-session total returns
  binding_status: BOUND
  same_binding_as: P01
  readiness: VERIFIED_HISTORICAL_AVAILABILITY
- id: P05
  alias: trade_neighbor_return_21
  definition: non-self PIT trade-weighted neighbors trailing 21-session return
  binding_status: BOUND
  database: loop
  table_or_view: graph_edge_vintages (edge_type='trade') + t2_levels_daily
  selector: focal = market; weights at latest vintage with applies_from <= origin
  historical_availability_rule: applies_from is the publication lag; vintage_end = data through
  coverage: 30 focal markets; focals missing ChinaH, NASDAQ, Taiwan, US SmallCap;
    Saudi Arabia edges only from 2014-10 vintage; Vietnam from 2006-12
  readiness: VERIFIED_HISTORICAL_AVAILABILITY (for the 30 focal markets)
- id: P06
  alias: trade_neighbor_return_63
  binding_status: BOUND
  same_binding_as: P05
  readiness: VERIFIED_HISTORICAL_AVAILABILITY
- id: P07
  alias: bank_neighbor_return_21
  definition: non-self PIT banking-weighted neighbors trailing 21-session return
  binding_status: BOUND_BUT_LIMITED
  database: loop
  table_or_view: graph_edge_vintages (edge_type='bank') + t2_levels_daily
  coverage: 21 focal markets ONLY; staggered focal entry (Canada 2008-01,
    South Africa 2010-01, Spain 2012-10, Italy 2015-04, Philippines 2017-04).
    Missing focals: ChinaA, ChinaH, India, Indonesia, Malaysia, NASDAQ, Poland,
    Saudi Arabia, Singapore, Thailand, Turkey, US SmallCap, Vietnam.
  readiness: INSUFFICIENT_COVERAGE
- id: P08
  alias: bank_neighbor_return_63
  binding_status: BOUND_BUT_LIMITED
  same_binding_as: P07
  readiness: INSUFFICIENT_COVERAGE
- id: P09
  alias: fx_iv_3m
  definition: ATM 3M FX implied volatility
  binding_status: BOUND
  database: loop
  table_or_view: market_implied_daily
  selector: variable = 'FX_IMPVOL_3M_PCT'
  units_and_quote: percent, annualized; EURUSD surface broadcast to FRA/DEU/ITA/NLD/ESP;
    USDCNH to ChinaA+ChinaH
  coverage: 29 markets (none for Denmark, Vietnam, U.S., NASDAQ, US SmallCap —
    USD numeraire has no pair; Denmark/Vietnam structurally skipped by collector)
  readiness: VERIFIED_HISTORICAL_AVAILABILITY (for the 29 markets)
- id: P10
  alias: fx_iv_term_1w_3m
  definition: ATM 1W FX implied vol minus ATM 3M
  binding_status: BOUND
  selector: variable = 'FX_IMPVOL_1W_PCT' minus 'FX_IMPVOL_3M_PCT'
  coverage: as P09
  readiness: VERIFIED_HISTORICAL_AVAILABILITY
- id: P11
  alias: fx_rr25_3m_depreciation
  definition: 3M 25-delta risk reversal oriented as local depreciation premium
  binding_status: SPECIFIED_TENOR_MISSING
  note: >-
    Collector pulls [PAIR]25R1M only — no 3M RR exists in market_implied_daily or
    anywhere upstream. FX_RR25_1M_PCT (29 markets, sign-normalized so positive =
    local depreciation premium, matching the specified orientation) is the only
    candidate and is a DIFFERENT TENOR — recorded as a required amendment, not a
    substitution.
  readiness: MISSING
- id: P12
  alias: fx_carry_3m
  definition: 3M carry, audited currency/percentage convention
  binding_status: BOUND
  selector: variable = 'FX_CARRY_3M_PCT'
  units_and_quote: annualized pct, sign = local short rates above USD (documented in
    collector); derived from [ROOT]3M outright forwards + spot
  coverage: 30 markets (adds Denmark via USDDKK forward; still none for US complex
    or Vietnam)
  readiness: VERIFIED_HISTORICAL_AVAILABILITY
- id: P13
  alias: sovereign_yield_2y
  binding_status: BOUND
  database: loop
  table_or_view: sovereign_daily
  selector: variable = 'SOV_2Y_YIELD_PCT'
